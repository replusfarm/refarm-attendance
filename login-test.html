
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Re:+farm 勤怠管理</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: sans-serif;
      background: #f1f6f2;
      color: #20533d;
    }

    header {
      background: #20533d;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    main {
      max-width: 420px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 3px 12px #00000012;
    }

    h2 { margin: 0; }

    label {
      display: block;
      font-weight: bold;
      margin: 20px 0 8px;
    }

    select, input {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 17px;
      margin-top: 25px;
      background: #20533d;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    #message {
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <header>
    <h2>Re:+farm</h2>
    <p>勤怠管理システム</p>
  </header>

  <main>
    <div class="card">
      <h3>ログイン</h3>

      <label for="staff">名前を選択</label>
      <select id="staff">
        <option value="">読み込み中...</option>
      </select>

      <label for="personalId">PersonalID</label>
      <input
        id="personalId"
        type="password"
        inputmode="numeric"
        maxlength="6"
        pattern="[0-9]{6}"
        autocomplete="off"
        placeholder="6桁のPersonalID"
      >

      <button onclick="login()">ログイン</button>

      <p id="message"></p>
    </div>
  </main>

  <script>
    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbzrhMtfCLkAUlRaYLUBBvfbH9GN3sxyWpW-P0NXM1Na32w6bVFEKRh1gKdZE3Ig5mYjhQ/exec';

    async function loadEmployees() {
      const staff = document.getElementById('staff');

      try {
        const response = await fetch(
          GAS_URL + '?action=employees'
        );

        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        const result = await response.json();

        if (!result.success ||
            !Array.isArray(result.employees)) {
          throw new Error('従業員データが不正です。');
        }

        staff.replaceChildren();
        staff.add(new Option('選択してください', ''));

        result.employees.forEach(name => {
          staff.add(new Option(name, name));
        });

      } catch (error) {
        staff.replaceChildren();
        staff.add(
          new Option('従業員名を取得できません', '')
        );
        console.error(error);
      }
    }

    async function login() {
      const name =
        document.getElementById('staff').value;

      const id =
        document.getElementById('personalId').value;

      const message =
        document.getElementById('message');

      if (!name) {
        message.textContent =
          '名前を選択してください。';
        return;
      }

      if (!/^[0-9]{6}$/.test(id)) {
        message.textContent =
          'PersonalIDは6桁で入力してください。';
        return;
      }

      message.textContent = '認証中...';

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain'
          },
          body: JSON.stringify({
            action: 'login',
            name: name,
            personalId: id
          }),
          redirect: 'follow'
        });

        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        const result = await response.json();

        if (result.success && result.data?.success) {
          message.textContent = 'ログイン成功';

          window.location.href = 'punch.html';
        } else {
          message.textContent =
            result.message ||
            'ログインできませんでした。';
        }

      } catch (error) {
        message.textContent =
          '通信エラーが発生しました。';
        console.error(error);
      }
    }

    loadEmployees();
  </script>
</body>
</html>
