
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Re:+farm Manager</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f1f6f2;
      color: #20533d;
    }
    header {
      background: #20533d;
      color: white;
      text-align: center;
      padding: 22px;
    }
    main {
      max-width: 480px;
      margin: 24px auto;
      padding: 0 15px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 16px;
    }
    input, button {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
    }
    input { border: 1px solid #bbb; }
    button {
      border: none;
      background: #20533d;
      color: white;
      margin-top: 12px;
      cursor: pointer;
    }
    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .secondary {
      background: #e5eee7;
      color: #20533d;
    }
    #message {
      white-space: pre-wrap;
      line-height: 1.6;
    }
    #managerPanel { display: none; }
    .note { color: #666; font-size: 13px; }
  </style>
</head>
<body>
  <header>
    <h2>Re:+farm Manager</h2>
    <p>管理者専用画面</p>
  </header>

  <main>
    <section class="card" id="loginPanel">
      <h3>Manager認証</h3>
      <p>給与明細閲覧PASSを入力してください。</p>

      <input
        id="managerPassword"
        type="password"
        autocomplete="off"
        placeholder="給与明細閲覧PASS"
      >

      <button id="loginButton" onclick="managerLogin()">
        Managerログイン
      </button>

      <p id="message"></p>
    </section>

    <section class="card" id="managerPanel">
      <h3>管理メニュー</h3>
      <p id="welcome"></p>

     
<button onclick="showAttendancePanel()">
  勤怠履歴を見る
</button>

      <button disabled>給与計算・再計算（準備中）</button>
      <button disabled>手当・控除管理（準備中）</button>
      <button disabled>給与明細の確定・公開（準備中）</button>

      <p class="note">
        各機能はサーバー側の管理者認証を接続後に利用できます。
      </p>

      <button class="secondary" onclick="logoutManager()">
        Managerログアウト
      </button>
    </section>

<section class="card" id="attendancePanel" style="display:none;">
  <h3>勤怠履歴</h3>

  <label for="attendanceEmployee">従業員名</label>
  <input
    id="attendanceEmployee"
    type="text"
    placeholder="従業員名を入力"
  >

  <label for="attendanceDate">対象日</label>
  <input id="attendanceDate" type="date">

  <button id="historyButton" onclick="loadAttendanceHistory()">
    履歴を表示
  </button>

  <p id="attendanceMessage" role="status"></p>
  <div id="attendanceResults"></div>

  <button class="secondary" onclick="hideAttendancePanel()">
    管理メニューに戻る
  </button>
</section>

    <button class="secondary" onclick="location.href='punch.html'">
      打刻画面に戻る
    </button>
  </main>

  <script>
    const GAS_URL =
  'https://script.google.com/macros/s/AKfycbwTM24N8r9IoX3R680dc9sLqTuCDBRzkuYunID2MKWbqbw8LBx4pGvmwoYUBAmDT4qQRA/exec';
    const loginToken = sessionStorage.getItem('refarmToken');
    const employeeName = sessionStorage.getItem('refarmEmployee');

    if (!loginToken || !employeeName) {
      location.replace('login-test.html');
    }

    async function callApi(action, data) {
      const response = await fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action, ...data })
      });

      if (!response.ok) {
        throw new Error('通信エラー：' + response.status);
      }

      const result = await response.json();

      if (!result.success) {
        throw new Error(result.message || '処理に失敗しました');
      }

      return result.data;
    }

    async function managerLogin() {
      const password =
        document.getElementById('managerPassword').value;
      const message = document.getElementById('message');
      const button = document.getElementById('loginButton');

      if (!password) {
        message.textContent = 'PASSを入力してください。';
        return;
      }

      button.disabled = true;
      message.textContent = '認証中...';

      try {
        const result = await callApi('managerLogin', {
          loginToken: loginToken,
          payslipPassword: password
        });

        if (!result.success || !result.managerToken) {
          throw new Error('Manager認証に失敗しました');
        }

        sessionStorage.setItem(
          'refarmManagerToken',
          result.managerToken
        );

        document.getElementById('managerPassword').value = '';
        document.getElementById('loginPanel').style.display = 'none';
        document.getElementById('managerPanel').style.display = 'block';
        document.getElementById('welcome').textContent =
          employeeName + ' さん';

      } catch (error) {
        message.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    }

    async function logoutManager() {
      sessionStorage.removeItem('refarmManagerToken');
      document.getElementById('managerPanel').style.display = 'none';
      document.getElementById('loginPanel').style.display = 'block';
      document.getElementById('message').textContent =
        'Manager画面からログアウトしました。';
    }
 
function showAttendancePanel() {
  document.getElementById('managerPanel').style.display = 'none';
  document.getElementById('attendancePanel').style.display = 'block';

  document.getElementById('attendanceEmployee').value =
    employeeName;

  document.getElementById('attendanceDate').value =
    new Date().toLocaleDateString('sv-SE', {
      timeZone: 'Asia/Tokyo'
    });

  document.getElementById('attendanceMessage').textContent = '';
  document.getElementById('attendanceResults').replaceChildren();
}

function hideAttendancePanel() {
  document.getElementById('attendancePanel').style.display = 'none';
  document.getElementById('managerPanel').style.display = 'block';
}

async function loadAttendanceHistory() {
  const employeeNameValue =
    document.getElementById('attendanceEmployee').value.trim();

  const targetDate =
    document.getElementById('attendanceDate').value;

  const message =
    document.getElementById('attendanceMessage');

  const results =
    document.getElementById('attendanceResults');

  const button =
    document.getElementById('historyButton');

  results.replaceChildren();

  if (!employeeNameValue || !targetDate) {
    message.textContent = '従業員名と日付を指定してください。';
    return;
  }

  const managerToken =
    sessionStorage.getItem('refarmManagerToken');

  if (!managerToken) {
    message.textContent = 'Manager認証が必要です。';
    return;
  }

  button.disabled = true;
  message.textContent = '勤怠履歴を取得中...';

  try {
    const data = await callApi('managerAttendanceHistory', {
      loginToken,
      managerToken,
      employeeName: employeeNameValue,
      targetDate
    });

    if (!data || !Array.isArray(data.records)) {
      throw new Error('勤怠履歴の応答が正しくありません。');
    }

    message.textContent =
      data.records.length + '件の打刻が見つかりました。';

    data.records.forEach(record => {
      const item = document.createElement('div');
      item.style.padding = '12px 0';
      item.style.borderBottom = '1px solid #ddd';

      const type = document.createElement('strong');
      type.textContent = record.type;

      const time = document.createElement('span');
      time.textContent = '　' + record.time;

      
      item.append(type, time);

      const editButton = document.createElement('button');
      editButton.type = 'button';
      editButton.className = 'secondary';
      editButton.textContent = 'この打刻を修正';
      editButton.style.marginTop = '8px';

      editButton.addEventListener('click', () => {
        showAttendanceEditForm(record, item);
      });

      item.appendChild(editButton);
      results.appendChild(item);

    });

  } catch (error) {
    message.textContent =
      error.message || '勤怠履歴を取得できませんでした。';
  } finally {
    button.disabled = false;
  }
}

function showAttendanceEditForm(record, item) {
  // 同時に複数の修正フォームを開かない
  document.querySelectorAll('.attendance-edit-form')
    .forEach(element => element.remove());

  const form = document.createElement('div');
  form.className = 'attendance-edit-form';
  form.style.marginTop = '12px';
  form.style.padding = '12px';
  form.style.background = '#f1f6f2';
  form.style.borderRadius = '10px';

  const heading = document.createElement('p');
  heading.textContent =
    record.type + '：' + record.time + ' を修正';

  const timeLabel = document.createElement('label');
  timeLabel.textContent = '修正後の時刻（時:分:秒）';

  const timeInput = document.createElement('input');
  timeInput.type = 'time';
  timeInput.step = '1';
  timeInput.value = record.time;

  const reasonLabel = document.createElement('label');
  reasonLabel.textContent = '修正理由（必須）';

  const reasonInput = document.createElement('input');
  reasonInput.type = 'text';
  reasonInput.maxLength = 500;
  reasonInput.placeholder = '例：打刻時刻の間違い';

  const previewButton = document.createElement('button');
  previewButton.type = 'button';
  previewButton.textContent = '修正内容を確認';
const commitButton = document.createElement('button');
commitButton.type = 'button';
commitButton.textContent = 'この内容で修正を確定';
commitButton.disabled = true;
commitButton.style.background = '#b45309';
  const cancelButton = document.createElement('button');
  cancelButton.type = 'button';
  cancelButton.className = 'secondary';
  cancelButton.textContent = 'キャンセル';

  const message = document.createElement('p');
  message.style.whiteSpace = 'pre-wrap';
  message.setAttribute('role', 'status');

  cancelButton.addEventListener('click', () => {
    form.remove();
  });
let confirmedPreview = null;

timeInput.addEventListener('input', () => {
  confirmedPreview = null;
  commitButton.disabled = true;
});

reasonInput.addEventListener('input', () => {
  confirmedPreview = null;
  commitButton.disabled = true;
});
  previewButton.addEventListener('click', async () => {
    const newTime = timeInput.value;
    const reason = reasonInput.value.trim();

    if (!newTime || !reason) {
      message.textContent =
        '修正後の時刻と理由を入力してください。';
      return;
    }

    // ブラウザによって秒が省略される場合に対応
    const normalizedTime =
      /^\d{2}:\d{2}$/.test(newTime)
        ? newTime + ':00'
        : newTime;

    const managerToken =
      sessionStorage.getItem('refarmManagerToken');

    if (!managerToken) {
      message.textContent = 'Manager認証が必要です。';
      return;
    }

    previewButton.disabled = true;
    message.textContent = '修正内容を確認中...';

    try {
      const result = await callApi(
        'managerAttendanceEditPreview',
        {
          loginToken,
          managerToken,
          recordId: record.id,
          newTime: normalizedTime,
          reason
        }
      );

      if (!result || result.valid !== true ||
          result.previewOnly !== true) {
        throw new Error('確認結果が正しくありません。');
      }

      message.textContent =
        '【修正内容の確認成功】\n' +
        '従業員：' + result.employee + '\n' +
        '対象日：' + result.date + '\n' +
        '打刻区分：' + result.type + '\n' +
        '修正前：' + result.oldTime + '\n' +
        '修正後：' + result.newTime + '\n' +
        '修正理由：' + result.reason + '\n\n' +
        '※確認のみです。実データは変更していません。';
confirmedPreview = {
  recordId: record.id,
  expectedOldTime: result.oldTime,
  newTime: result.newTime,
  reason: result.reason
};

commitButton.disabled = false;
    } catch (error) {
      message.textContent =
        '確認できませんでした：' +
        (error.message || '不明なエラー');
    } finally {
      previewButton.disabled = false;
    }
  });

  form.append(
    heading,
    timeLabel,
    timeInput,
    reasonLabel,
    reasonInput,
    previewButton,
    cancelButton,
    message
  );

  item.appendChild(form);
}

  </script>
</body>
</html>
