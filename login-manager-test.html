
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Re:+farm Manager検証ログイン</title>
</head>
<body>
  <h2>Manager検証用ログイン</h2>
  <p>通常の打刻には使用しないでください。</p>

  <label for="name">従業員名</label>
  <select id="name">
    <option value="">読み込み中...</option>
  </select>

  <p>
    <label for="pin">PersonalID（6桁）</label>
    <input id="pin" type="password" inputmode="numeric"
           maxlength="6" autocomplete="off">
  </p>

  <button id="loginButton" type="button" onclick="login()">
    検証用ログイン
  </button>
<section id="passRegisterPanel" hidden>
  <h3>給与明細PASSの初回登録</h3>
  <p>検証用ログイン後、本人のPASSを登録します。</p>

  <input
    id="newPayslipPassword"
    type="password"
    minlength="6"
    maxlength="128"
    autocomplete="new-password"
    placeholder="新しい給与明細PASS（6文字以上）"
  >

  <button id="registerPassButton" type="button"
          onclick="registerPayslipPassword()">
    給与明細PASSを初回登録
  </button>

  <p id="passRegisterMessage" role="status"></p>
</section>
  <p id="message" role="status"></p>

  <script>
   const GAS_URL =
  'https://script.google.com/macros/s/AKfycbzj6sUeOUsb8xuSS_YJ52ukSRyrkjL6VEtnaC1KIXtwZ_4Knw5bENpcDfBqAKfEY70oUw/exec';    
    function loadEmployees() {
  const select = document.getElementById('name');
  const message = document.getElementById('message');

  const callbackName = 'refarmEmployeesCallback';
  const script = document.createElement('script');

  const timeout = setTimeout(() => {
    cleanup();
    message.textContent =
      '従業員一覧エラー：通信がタイムアウトしました';
  }, 15000);

  function cleanup() {
    clearTimeout(timeout);
    script.remove();
    delete window[callbackName];
  }

  window[callbackName] = function(result) {
    cleanup();

    if (!result || !result.success) {
      message.textContent =
        '従業員一覧の取得に失敗しました';
      return;
    }

    const employees = Array.isArray(result.employees)
      ? result.employees
      : [];

    select.innerHTML = '<option value="">名前を選択</option>';

    employees.forEach(item => {
      const name = typeof item === 'string'
        ? item
        : item.name;

      if (!name) return;

      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      select.appendChild(option);
    });

    if (!employees.length) {
      message.textContent = '従業員一覧が空です';
    }
  };

  script.onerror = function() {
    cleanup();
    message.textContent =
      '従業員一覧エラー：通信に失敗しました';
  };

  script.src =
    GAS_URL +
    '?action=employees&callback=' +
    encodeURIComponent(callbackName);

   document.head.appendChild(script);
}

async function login() {      const name = document.getElementById('name').value;
      const personalId = document.getElementById('pin').value;
      const message = document.getElementById('message');
      const button = document.getElementById('loginButton');

      if (!name || !/^[0-9]{6}$/.test(personalId)) {
        message.textContent = '名前と6桁のPersonalIDを入力してください。';
        return;
      }

      button.disabled = true;
      message.textContent = '認証中...';

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'login',
            name: name,
            personalId: personalId
          })
        });

        const result = await response.json();

        if (!result.success || !result.data ||
            result.data.success !== true || !result.data.token) {
          throw new Error(result.message || 'ログインに失敗しました');
        }

        sessionStorage.setItem('refarmToken', result.data.token);
        sessionStorage.setItem('refarmEmployee', result.data.name);

        // 検証用ログイン成功後、PASS登録欄を表示
document.getElementById('passRegisterPanel').hidden = false;
document.getElementById('pin').value = '';
message.textContent =
  '本人確認ができました。初回登録する場合は給与明細PASSを入力してください。';
      } catch (error) {
        message.textContent = 'エラー：' + error.message;
        button.disabled = false;
      }
    }

     async function registerPayslipPassword() {
      const message = document.getElementById('passRegisterMessage');
      const button = document.getElementById('registerPassButton');
      const input = document.getElementById('newPayslipPassword');
      const password = input.value;
      const token = sessionStorage.getItem('refarmToken');

      if (!token) {
        message.textContent = '先に検証用ログインをしてください。';
        return;
      }

      if (password.length < 6 || password.length > 128) {
        message.textContent = 'PASSは6〜128文字で入力してください。';
        return;
      }

      if (!confirm('このPASSを初回登録しますか？')) {
        return;
      }

      button.disabled = true;
      message.textContent = '登録中...';

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },
          body: JSON.stringify({
            action: 'payslipRegisterPassword',
            loginToken: token,
            password: password
          })
        });

        const result = await response.json();

        if (!result.success || !result.data ||
            result.data.success !== true) {
          throw new Error(
            result.message || 'PASS登録に失敗しました'
          );
        }

        input.value = '';
        message.textContent = '給与明細PASSの登録が完了しました。';
        button.disabled = true;

      } catch (error) {
        message.textContent = 'エラー：' + error.message;
        button.disabled = false;
      }
    }

    loadEmployees();
  </script>
</body>
</html>
