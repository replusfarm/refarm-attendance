
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Re:+farm Manager認証テスト</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f1f6f2;
      color: #20533d;
      margin: 0;
      padding: 20px;
    }
    main {
      max-width: 440px;
      margin: 40px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
    }
    button {
      width: 100%;
      padding: 15px;
      background: #20533d;
      color: white;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }
    #result {
      white-space: pre-wrap;
      margin-top: 20px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <h2>Re:+farm Manager認証テスト</h2>
    <p>ログイン中の管理者権限を確認します。</p>
    <button id="checkButton" onclick="checkRole()">
      Manager権限を確認
    </button>
    <p id="result">まだ確認していません。</p>
    <p><a href="punch.html">打刻画面へ戻る</a></p>
  </main>

  <script>
    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbwTM24N8r9IoX3R680dc9sLqTuCDBRzkuYunID2MKWbqbw8LBx4pGvmwoYUBAmDT4qQRA/exec';

    async function checkRole() {
      const resultEl = document.getElementById('result');
      const button = document.getElementById('checkButton');
      const token = sessionStorage.getItem('refarmToken');

      if (!token) {
        resultEl.textContent =
          'ログイン情報がありません。先に通常のログインを行ってください。';
        return;
      }

      button.disabled = true;
      resultEl.textContent = '確認中...';

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain'
          },
          body: JSON.stringify({
            action: 'managerRole',
            loginToken: token
          })
        });

        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        const result = await response.json();

        if (!result.success) {
          throw new Error(result.message || '認証エラー');
        }

        if (result.data?.role === 'Manager') {
          resultEl.textContent =
            '管理者権限を確認できました。';
        } else if (result.data?.role === 'Member') {
          resultEl.textContent =
            '一般従業員として認証されました。';
        } else {
          resultEl.textContent =
            '予期しない応答が返されました。';
        }

      } catch (error) {
        resultEl.textContent =
          '確認できませんでした：' + error.message;
      } finally {
        button.disabled = false;
      }
    }
  </script>
</body>
</html>
