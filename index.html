
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Re:+farm 勤怠管理</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f1f6f2;
      margin: 0;
      color: #20533d;
    }
    header {
      background: #20533d;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
    }
    button {
      background: #20533d;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-size: 18px;
      width: 100%;
      margin-top: 12px;
    }
    #reader { width: 100%; }
    #status { margin-top: 15px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <p id="selectedType" style="
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#287b45;
">
  打刻の種類を確認中...
</p>

  <header>
    <h2>Re:+farm 勤怠管理</h2>
  </header>
  <main>
    <div class="card">
      <h3>QRコード読み取りテスト</h3>
      <p>カメラを起動してQRコードを読み取ります。</p>
      <button onclick="startCamera()">カメラを起動</button>
      <button onclick="stopCamera()">カメラを停止</button>
      <div id="reader"></div>
      <p id="status">準備完了です。</p>
    </div>
  </main>
  <script>

const loginToken = sessionStorage.getItem('refarmToken');
const employeeName = sessionStorage.getItem('refarmEmployee');

if (!loginToken || !employeeName) {
  alert('ログイン情報がありません。ログインし直してください。');
  window.location.replace('login-test.html');
}
    
const params = new URLSearchParams(window.location.search);
const selectedType = params.get('type');

const allowedTypes = [
  '出勤',
  '退勤',
  '休憩開始',
  '休憩終了'
];

if (allowedTypes.includes(selectedType)) {
  document.getElementById('selectedType').textContent =
    '選択中：' + selectedType;
} else {
  document.getElementById('selectedType').textContent =
    '打刻の種類が選択されていません。';
}

    let scanner = null;

    async function startCamera() {
      const status = document.getElementById('status');
      if (scanner) return;

      if (typeof Html5Qrcode === 'undefined') {
        status.textContent = 'QR読み取りライブラリを読み込めませんでした。';
        return;
      }

      try {
        scanner = new Html5Qrcode('reader');
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: 230 },
          

async (decodedText) => {
  status.textContent = '職場QRコードを読み取りました。';
  await stopCamera();
},

          () => {}
        );
        status.textContent = 'QRコードをカメラに映してください。';
      } catch (error) {
        status.textContent = 'カメラ起動エラー: ' + error;
        scanner = null;
      }
    }

    async function stopCamera() {
      if (!scanner) return;
      const current = scanner;
      scanner = null;
      try {
        if (current.isScanning) await current.stop();
        current.clear();
      } catch (error) {
        document.getElementById('status').textContent =
          '停止エラー: ' + error;
      }
    }
  </script>
</body>
</html>
