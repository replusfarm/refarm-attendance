
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Re:+farm 勤怠管理</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      background: #f1f6f2;
      margin: 0;
      color: #20533d;
    }

    header {
      background: #20533d;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 500px;
      margin: 20px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    button {
      background: #20533d;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-size: 18px;
      width: 100%;
      margin-top: 12px;
    }

    /* QRコードカメラのスマホ表示調整 */
    #reader {
      width: 100%;
      max-width: 360px;
      margin: 16px auto;
      overflow: hidden;
      box-sizing: border-box;
    }

    #reader video {
      width: 100% !important;
      max-width: 100% !important;
      height: auto !important;
      object-fit: contain;
    }

    #reader canvas {
      max-width: 100% !important;
    }

    #reader img {
      max-width: 100% !important;
    }

    @media (max-width: 480px) {
      #reader {
        max-width: 300px;
      }
    }

    #status {
      margin-top: 15px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <p id="selectedType" style="
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#287b45;
">
  打刻の種類を確認中...
</p>

  <header>
    <h2>Re:+farm 勤怠管理</h2>
  </header>
  <main>
    <div class="card">
      <h3>QRコード読み取りテスト</h3>
      <p>カメラを起動してQRコードを読み取ります。</p>
      <button onclick="startCamera()">カメラを起動</button>
      <button onclick="stopCamera()">カメラを停止</button>
      <div id="reader"></div>
      <p id="status">準備完了です。</p>
    </div>
  </main>
  <script>

const loginToken = sessionStorage.getItem('refarmToken');
const employeeName = sessionStorage.getItem('refarmEmployee');

if (!loginToken || !employeeName) {
  alert('ログイン情報がありません。ログインし直してください。');
  window.location.replace('login-test.html');
}
    
const params = new URLSearchParams(window.location.search);
const selectedType = params.get('type');

const allowedTypes = [
  '出勤',
  '退勤',
  '休憩開始',
  '休憩終了'
];

if (allowedTypes.includes(selectedType)) {
  document.getElementById('selectedType').textContent =
    '選択中：' + selectedType;
} else {
  document.getElementById('selectedType').textContent =
    '打刻の種類が選択されていません。';
}

    let scanner = null;

let scannedQrValue = null;

    async function startCamera() {
      const status = document.getElementById('status');
      if (scanner) return;

      if (typeof Html5Qrcode === 'undefined') {
        status.textContent = 'QR読み取りライブラリを読み込めませんでした。';
        return;
      }

      try {
        scanner = new Html5Qrcode('reader');
        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: 230 },
          



async (decodedText) => {
  if (scannedQrValue !== null) return;

  scannedQrValue = decodedText;
  status.textContent = '職場QRコードを確認しています…';

  await stopCamera();
  await sendAttendance();
},


          () => {}
        );
        status.textContent = 'QRコードをカメラに映してください。';
      } catch (error) {
        status.textContent = 'カメラ起動エラー: ' + error;
        scanner = null;
      }
    }

async function sendAttendance() {
  const status = document.getElementById('status');

  if (!allowedTypes.includes(selectedType)) {
    status.textContent = '打刻の種類が正しくありません。';
    return;
  }

  if (!scannedQrValue) {
    status.textContent = '先に職場QRコードを読み取ってください。';
    return;
  }

  const token = sessionStorage.getItem('refarmToken');
  const name = sessionStorage.getItem('refarmEmployee');

  if (!token || !name) {
    status.textContent = 'ログインし直してください。';
    return;
  }

  status.textContent = '勤怠記録を送信しています…';

  try {
    const response = await fetch(
      'https://script.google.com/macros/s/AKfycbzrhMtfCLkAUlRaYLUBBvfbH9GN3sxyWpW-P0NXM1Na32w6bVFEKRh1gKdZE3Ig5mYjhQ/exec',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain'
        },
        body: JSON.stringify({
          action: 'punch',
          name: name,
          personalId: token,
          type: selectedType,
          qrValue: scannedQrValue
        })
      }
    );

    const result = await response.json();

    if (!result.success) {
      status.textContent = result.message || '打刻に失敗しました。';
      return;
    }

    status.textContent = '打刻を記録しました：' + selectedType;
    scannedQrValue = null;

  } catch (error) {
    status.textContent =
      '通信エラーが発生しました。記録状況を確認してください。';
  }
}

    async function stopCamera() {
      if (!scanner) return;
      const current = scanner;
      scanner = null;
      try {
        if (current.isScanning) await current.stop();
        current.clear();
      } catch (error) {
        document.getElementById('status').textContent =
          '停止エラー: ' + error;
      }
    }
  </script>
</body>
</html>
