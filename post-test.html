
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Re:+farm 通信テスト</title>
</head>
<body>
  <h2>Re:+farm POST通信テスト</h2>
  <button id="sendButton">POST通信を試す</button>
  <p id="result">まだ通信していません。</p>

  <script>
    
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzrhMtfCLkAUlRaYLUBBvfbH9GN3sxyWpW-P0NXM1Na32w6bVFEKRh1gKdZE3Ig5mYjhQ/exec';

    document.getElementById('sendButton').addEventListener('click', async () => {
      const result = document.getElementById('result');
      result.textContent = '通信中...';

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain'
          },
          

body: JSON.stringify({
  action: 'login',
  name: '存在しないテスト従業員',
  personalId: '000000'
}),


          redirect: 'follow'
        });

        const text = await response.text();
        result.textContent = '成功：' + text;
      } catch (error) {
        result.textContent = '通信エラー：' + error.message;
      }
    });
  </script>
</body>
</html>
