
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Re:+farm 勤怠管理</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f7f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 420px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 3px 12px #0001;
    }

    h1 {
      color: #287b45;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    button {
      padding: 25px 5px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      background: #287b45;
      color: white;
    }

    button:active {
      opacity: 0.7;
    }

    .break {
      background: #4679a8;
    }

    #message {
      margin-top: 25px;
      color: #333;
      min-height: 24px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Re:+farm</h1>
    <p class="subtitle">勤怠管理・打刻選択</p>

    <div class="buttons">
      <button onclick="selectPunch('出勤')">
        出勤
      </button>

      <button onclick="selectPunch('退勤')">
        退勤
      </button>

      <button class="break"
              onclick="selectPunch('休憩開始')">
        休憩開始
      </button>

      <button class="break"
              onclick="selectPunch('休憩終了')">
        休憩終了
      </button>
    </div>

<div style="margin-top:24px;">
  <button
    type="button"
    onclick="window.location.href='login-manager-test.html'"
    style="width:100%; background:#20533d;">
    Managerログイン
  </button>
</div>

<div id="managerMenu" style="display:none; margin-top:12px;">
  <button
    type="button"
    onclick="window.location.href='manager.html'"
    style="width:100%; background:#20533d;">
    Manager（管理者メニュー）
  </button>
</div>
    <p id="message"></p>
  </div>

  <script>
    

async function selectPunch(type) {
  const allowedTypes = ['出勤', '退勤', '休憩開始', '休憩終了'];

  if (!allowedTypes.includes(type)) return;

  // 出勤・退勤は職場QRコードを読み取る
  if (type === '出勤' || type === '退勤') {
    window.location.href =
      'index.html?type=' + encodeURIComponent(type);
    return;
  }

  // 休憩開始・休憩終了はQRコード不要
  const token = sessionStorage.getItem('refarmToken');
  const name = sessionStorage.getItem('refarmEmployee');

  if (!token || !name) {
    alert('ログインし直してください。');
    window.location.replace('login-test.html');
    return;
  }

  // 二重送信防止
  if (window.breakPunchSending) return;
  window.breakPunchSending = true;

  try {
    const response = await fetch(
      'https://script.google.com/macros/s/AKfycbzrhMtfCLkAUlRaYLUBBvfbH9GN3sxyWpW-P0NXM1Na32w6bVFEKRh1gKdZE3Ig5mYjhQ/exec',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain'
        },
        body: JSON.stringify({
          action: 'punch',
          name: name,
          personalId: token,
          type: type,
          qrValue: ''
        })
      }
    );

    const result = await response.json();

    if (!result.success) {
      alert(result.message || '打刻に失敗しました。');
      return;
    }

    alert('打刻を記録しました：' + type);

  } catch (error) {
    alert(
      '通信エラーが発生しました。勤怠記録シートを確認してください。'
    );
  } finally {
    window.breakPunchSending = false;
  }
}

async function loadManagerRole() {
  const token = sessionStorage.getItem('refarmToken');
  if (!token) return;

  try {
    const response = await fetch(
      'https://script.google.com/macros/s/AKfycbzrhMtfCLkAUlRaYLUBBvfbH9GN3sxyWpW-P0NXM1Na32w6bVFEKRh1gKdZE3Ig5mYjhQ/exec',
      {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: 'managerRole',
          loginToken: token
        })
      }
    );

    const result = await response.json();

    if (
      result.success &&
      result.data &&
      result.data.role === 'Manager'
    ) {
      document.getElementById('managerMenu').style.display = 'block';
    }
  } catch (error) {
    console.error('Manager権限を確認できませんでした', error);
  }
}

loadManagerRole();

  </script>
</body>
</html>
